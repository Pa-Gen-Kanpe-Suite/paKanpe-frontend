name: Frontend CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Déclaration globale de la variable pour le webhook du job
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      # 1. Convertit le nom du dépôt en minuscules (ex: paKanpe-frontend -> pakanpe-frontend)
      - name: Downcase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Utilisation de env.REPO_LOWER au lieu de github.repository
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest

      - name: Trigger staging deployment
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_WEBHOOK_URL"