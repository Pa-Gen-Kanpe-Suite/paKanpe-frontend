name: Frontend CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Utilisation de $GITHUB_OUTPUT (méthode officielle recommandée par GitHub)
      - name: Lowercase repository name
        id: repo_format
        run: |
          echo "repo_lower=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Utilisation de ${{ steps.repo_format.outputs.repo_lower }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_format.outputs.repo_lower }}:${{ github.sha }}
            ghcr.io/${{ steps.repo_format.outputs.repo_lower }}:latest

      - name: Trigger staging deployment
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_WEBHOOK_URL"